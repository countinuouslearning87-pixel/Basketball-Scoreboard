<html>
    <head>
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <div id="home-score">0</div>
                <button onclick="plusOneHome()" class="first-button">+1</button>
                <button onclick="plusTwoHome()" class="second-button">+2</button>
                <button onclick="plusThreeHome()"class="third-button">+3</button>
            </div>
            <div>
                <h3>GUEST</h3>
                <div id="guest-score">0</div>
                <button onclick="plusOneGuest()" class="first-button">+1</button>
                <button onclick="plusTwoGuest()" class="second-button">+2</button>
                <button onclick="plusThreeGuest()" class="third-button">+3</button>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
